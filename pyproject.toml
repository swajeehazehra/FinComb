[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fincomb"
version = "0.1.0"
description = "Financial intelligence and quantitative research platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.1,<4",
    "alembic>=1.13,<2",
    "pydantic-settings>=2.2,<3",
    "pandas>=2.2,<4",
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",  # SLSQP optimiser and normal quantiles (Milestone 4)
    "statsmodels>=0.14,<1",  # HAC regression and ADF test (Milestone 5)
    "yfinance>=0.2.50",
    "typer>=0.12,<1",
    "tzdata>=2024.1",  # time-zone database for zoneinfo (Windows has none built in)
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "httpx>=0.27",  # FastAPI TestClient
]

[project.scripts]
fincomb = "fincomb.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # Newer Starlette suggests the httpx2 package for TestClient; httpx works the same.
    "ignore:Using `httpx` with `starlette.testclient`",
]
markers = [
    "integration: needs a running PostgreSQL (skipped automatically if unreachable)",
    "performance: backtest timing checks (skip with -m \"not performance\")",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
